name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * 1"

jobs:
  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run hassfest
        uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run HACS validation
        uses: hacs/action@main
        with:
          category: integration
          # This ships as a "Custom repository", not a HACS-default one, and the
          # domain isn't in home-assistant/brands. Drop this line if it's ever
          # submitted to brands.
          ignore: brands
